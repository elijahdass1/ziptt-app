<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="zip.tt vendor banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0A0A0A"/>
      <stop offset="50%"  stop-color="#1A1500"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%"   stop-color="#C9A84C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stripes" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="34" height="34" fill="transparent"/>
      <rect width="14" height="34" fill="#C9A84C" opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#stripes)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <text x="600" y="160" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="64" font-weight="900" fill="#C9A84C" letter-spacing="-1">zip.tt</text>
  <text x="600" y="200" text-anchor="middle" font-family="-apple-system, Segoe UI, Inter, Arial, sans-serif"
        font-size="15" font-weight="500" fill="#9A8F7A" letter-spacing="3">TRINIDAD &amp; TOBAGO MARKETPLACE</text>
</svg>
